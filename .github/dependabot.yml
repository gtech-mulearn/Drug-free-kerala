version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      next-react:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react", "@types/react-dom"]
      testing:
        patterns: ["vitest", "@vitejs/*", "@testing-library/*", "@playwright/test", "jsdom"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*", "tailwind-merge", "tw-animate-css"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
